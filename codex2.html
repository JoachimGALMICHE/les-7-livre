<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex de la Divination</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Noto+Sans+Runic&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4a84b;
    --gold-light:#f3d98b;
    --ink:#2b1a0e;
    --ink-soft:#5a3f24;
    --red:#7a1a1a;
    --paper:#efe0bb;
    --paper-dark:#d9c393;
    --leather:#1d4a2e;
    --leather-dark:#0b2415;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'IM Fell English',Georgia,serif;
    color:var(--paper);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,170,60,.16), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.85), transparent 70%),
      repeating-linear-gradient(90deg,#1c0e06 0 3px,#22120a 3px 90px,#1a0c05 90px 93px,#24140b 93px 180px),
      #1a0c05;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 50px;
    overflow-x:hidden;
  }

  /* ---------- barre du haut ---------- */
  .topbar{
    width:min(1100px,100%);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-bottom:22px;
  }
  .back{
    font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.12em;
    color:var(--gold);text-decoration:none;
    padding:8px 14px;border:1px solid rgba(212,168,75,.5);border-radius:3px;
    background:rgba(0,0,0,.35);
    transition:background .25s,color .25s;
  }
  .back:hover{background:rgba(212,168,75,.15);color:var(--gold-light)}
  .topbar .label{font-family:'Cinzel',serif;color:#b99a62;font-size:.8rem;letter-spacing:.2em}

  /* ---------- le livre ouvert ---------- */
  .book{
    width:min(1100px,100%);
    position:relative;
    padding:14px;
    background:linear-gradient(180deg,#2a6040,var(--leather) 40%,var(--leather-dark));
    border-radius:10px;
    box-shadow:0 30px 70px rgba(0,0,0,.75), inset 0 0 0 2px rgba(212,168,75,.35), inset 0 0 30px rgba(0,0,0,.6);
    perspective:3200px;
  }
  .spread{
    display:grid;grid-template-columns:1fr 1fr;
    min-height:640px;
    position:relative;
    perspective:3200px;
  }
  .spread::after{ /* pli central */
    content:"";position:absolute;top:0;bottom:0;left:50%;width:60px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(60,35,10,.35) 40%,rgba(30,15,5,.55) 50%,rgba(60,35,10,.35) 60%,transparent);
    pointer-events:none;z-index:3;
  }
  .page{
    position:relative;
    padding:48px 52px 60px;
    background:
      radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.25),transparent 60%),
      radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.18),transparent 55%),
      linear-gradient(180deg,var(--paper),var(--paper-dark));
    color:var(--ink);
    overflow:hidden;
  }
  .page.left{border-radius:4px 0 0 4px;box-shadow:inset -18px 0 30px -18px rgba(60,35,10,.55)}
  .page.right{border-radius:0 4px 4px 0;box-shadow:inset 18px 0 30px -18px rgba(60,35,10,.55)}
  .page::before{ /* cadre ornemental */
    content:"";position:absolute;inset:18px;
    border:1px solid rgba(122,26,26,.35);
    outline:1px solid rgba(122,26,26,.18);outline-offset:4px;
    pointer-events:none;
  }
  .folio{
    position:absolute;bottom:26px;left:0;right:0;text-align:center;
    font-family:'Cinzel',serif;font-size:.8rem;color:var(--ink-soft);letter-spacing:.2em
  }

  /* contenu animé */
  .content{animation:turn .55s ease both;height:100%}
  .page.right .content{animation-delay:.08s}
  @keyframes turn{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

  /* ---------- page de titre ---------- */
  .title-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;min-height:520px}
  .title-page .pre{font-family:'Cinzel',serif;letter-spacing:.4em;font-size:.9rem;color:var(--ink-soft)}
  .title-page h1{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(2rem,4vw,3.2rem);line-height:1.1;margin:14px 0 6px;
    color:var(--red);
  }
  .title-page .num{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:var(--ink)}
  .sigil{width:130px;height:130px;margin:26px auto}
  .sigil circle,.sigil path,.sigil polygon{fill:none;stroke:var(--red);stroke-width:1.4}
  .title-page .motto{font-style:italic;font-size:1.1rem;color:var(--ink-soft);max-width:30ch}

  .lettrine::first-letter{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    float:left;font-size:3.4rem;line-height:.85;margin:6px 8px 0 0;color:var(--red);
  }

  /* ---------- sommaire ---------- */
  h2{
    font-family:'Cinzel Decorative',serif;font-weight:700;
    font-size:1.6rem;text-align:center;color:var(--red);margin-bottom:6px;
  }
  .rule{height:10px;margin:0 auto 18px;width:70%;
    background:
      radial-gradient(circle,var(--red) 2.5px,transparent 3.5px) center/10px 10px no-repeat,
      linear-gradient(90deg,transparent,rgba(122,26,26,.6) 20%,rgba(122,26,26,.6) 80%,transparent) center/100% 1px no-repeat}
  .toc{list-style:none}
  .toc li{margin:0}
  .toc a{
    display:flex;align-items:baseline;gap:10px;
    padding:6px 6px;
    color:var(--ink);text-decoration:none;
    border-radius:3px;
    transition:background .2s,color .2s,padding-left .2s;
    font-size:1.08rem;
  }
  .toc a:hover,.toc a:focus-visible{background:rgba(122,26,26,.09);color:var(--red);padding-left:12px;outline:none}
  .toc .code{font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;color:var(--red);min-width:42px}
  .toc .name{flex:0 1 auto}
  .toc .dots{flex:1;border-bottom:1px dotted rgba(90,63,36,.55);transform:translateY(-4px);min-width:16px}
  .toc .ch{font-family:'Cinzel',serif;font-size:.8rem;color:var(--ink-soft)}
  .toc li.last{margin-top:8px;padding-top:8px;border-top:1px solid rgba(122,26,26,.2)}

  /* ---------- page de chapitre ---------- */
  .chapter-open{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:520px}
  .chapter-open .kicker{font-family:'Cinzel',serif;letter-spacing:.35em;font-size:.85rem;color:var(--ink-soft)}
  .chapter-open .big{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(4rem,9vw,6.5rem);line-height:1;color:var(--red);margin:10px 0;
    text-shadow:0 2px 0 rgba(0,0,0,.08);
  }
  .chapter-open h3{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--ink);max-width:18ch;line-height:1.25}
  .chapter-open .code{margin-top:14px;font-family:'Cinzel',serif;font-weight:700;color:var(--red);letter-spacing:.2em;
    border-top:1px solid rgba(122,26,26,.4);border-bottom:1px solid rgba(122,26,26,.4);padding:4px 12px}

  .chapter-body h4{font-family:'Cinzel',serif;font-weight:700;color:var(--red);font-size:1.1rem;margin:0 0 10px;letter-spacing:.06em}
  .chapter-body p{font-size:1.1rem;line-height:1.6;margin-bottom:14px;color:var(--ink)}
  .chapter-body .empty{
    margin-top:18px;padding:18px;text-align:center;
    border:1px dashed rgba(122,26,26,.4);border-radius:4px;
    font-style:italic;color:var(--ink-soft)
  }

  /* ---------- chapitre : définition à gauche ---------- */
  .chapter-head{text-align:center;margin-bottom:14px}
  .chapter-head .kicker{font-family:'Cinzel',serif;letter-spacing:.35em;font-size:.8rem;color:var(--ink-soft)}
  .chapter-head h3{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.75rem);color:var(--red);line-height:1.2;margin:8px auto 10px;max-width:20ch}
  .chapter-head .code{display:inline-block;font-family:'Cinzel',serif;font-weight:700;color:var(--red);letter-spacing:.2em;font-size:.85rem;
    border-top:1px solid rgba(122,26,26,.4);border-bottom:1px solid rgba(122,26,26,.4);padding:3px 12px}
  .definition .def-label{font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px}
  .definition p{font-size:1.02rem;line-height:1.55;text-align:justify;hyphens:auto;color:var(--ink)}
  .definition .empty{margin-top:10px;padding:18px;text-align:center;border:1px dashed rgba(122,26,26,.4);border-radius:4px;font-style:italic;color:var(--ink-soft)}

  /* ---------- catégories (page droite) ---------- */
  .cats .cat{display:flex;align-items:baseline;gap:10px;padding:5px 6px;font-size:1.02rem;color:var(--ink);border-bottom:1px dotted rgba(90,63,36,.3)}
  .cats li:last-child .cat{border-bottom:none}
  .cats .code{font-family:'Cinzel',serif;font-weight:700;font-size:.78rem;color:var(--red);min-width:62px;white-space:nowrap}

  /* ---------- navigation ---------- */
  .nav{
    width:min(1100px,100%);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:20px;
  }
  .nav button{
    font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.1em;
    color:var(--gold);background:rgba(0,0,0,.35);
    border:1px solid rgba(212,168,75,.5);border-radius:3px;
    padding:10px 16px;cursor:pointer;
    transition:background .25s,color .25s,opacity .25s;
  }
  .nav button:hover:not(:disabled){background:rgba(212,168,75,.15);color:var(--gold-light)}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav .mid{flex:0 0 auto}

  /* ---------- couverture (ouverture) ---------- */
  .cover{
    position:absolute;top:0;bottom:0;left:50%;right:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    z-index:10;
    pointer-events:none;
    animation:openCover 1.6s cubic-bezier(.6,.05,.3,1) .35s forwards;
  }
  .cover .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:0 8px 8px 0;
  }
  .cover .front{
    background:
      radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.12),transparent 60%),
      linear-gradient(90deg,#0b2415,#2a6040 12%,var(--leather) 60%,var(--leather-dark));
    box-shadow:inset 0 0 0 2px rgba(212,168,75,.45), inset 0 0 0 10px rgba(0,0,0,.15), inset 0 0 40px rgba(0,0,0,.6), 12px 10px 30px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;color:var(--gold);padding:10px;
  }
  .cover .front::before{content:"";position:absolute;inset:16px;border:1px solid rgba(212,168,75,.5);border-radius:4px}
  .cover .front .ct{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(1rem,3.4vw,2.4rem);line-height:1.15;text-shadow:0 2px 0 #000}
  .cover .front .cn{font-family:'Cinzel Decorative',serif;font-size:clamp(.9rem,2.4vw,1.6rem);color:var(--gold-light)}
  .cover .front svg{width:clamp(50px,12vw,120px);height:auto}
  .cover .front svg *{fill:none;stroke:var(--gold);stroke-width:1.4}
  .cover .back{
    transform:rotateY(180deg);border-radius:8px 0 0 8px;
    background:
      repeating-radial-gradient(circle at 30% 40%,#2a4a36 0 6px,#1d3a28 6px 12px,#325a40 12px 16px),
      #1d3a28;
    box-shadow:inset 0 0 0 10px #0e2a18, inset 0 0 30px rgba(0,0,0,.6);
  }
  @keyframes openCover{
    0%{transform:rotateY(0)}
    100%{transform:rotateY(-180deg)}
  }
  .cover .back{animation:fadeBack .35s ease 1.8s forwards}
  @keyframes fadeBack{to{opacity:0}}
  .opened .cover{display:none}

  /* livre fermé au départ : seule la couverture est visible, centrée */
  .book:not(.opened){
    animation:openBook 1.6s cubic-bezier(.6,.05,.3,1) .35s both;
  }
  .book:not(.opened) .page.left .content,
  .book:not(.opened) .page.left .folio{animation:revealLeft 1.6s linear .35s both}
  @keyframes openBook{
    0%  {transform:translateX(-25%);clip-path:inset(-30% -30% -30% 50%)}
    40% {transform:translateX(-18%);clip-path:inset(-30% -30% -30% 50%)}
    100%{transform:translateX(0);   clip-path:inset(-30% -30% -30% -30%)}
  }
  @keyframes revealLeft{0%,55%{opacity:0}100%{opacity:1}}

  /* ---------- feuille qui tourne ---------- */
  .leaf{
    position:absolute;top:0;bottom:0;width:50%;
    z-index:8;pointer-events:none;
    background:linear-gradient(180deg,var(--paper),var(--paper-dark));
    box-shadow:0 0 25px rgba(0,0,0,.35);
  }
  .leaf.next{left:50%;transform-origin:left center;animation:leafNext .6s ease-in-out forwards;
    background:linear-gradient(90deg,rgba(60,35,10,.35),transparent 20%),linear-gradient(180deg,var(--paper),var(--paper-dark))}
  .leaf.prev{left:0;transform-origin:right center;animation:leafPrev .6s ease-in-out forwards;
    background:linear-gradient(270deg,rgba(60,35,10,.35),transparent 20%),linear-gradient(180deg,var(--paper),var(--paper-dark))}
  .leaf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent);animation:shade .6s ease-in-out forwards}
  @keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
  @keyframes leafNext{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
  @keyframes leafPrev{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}

  @media (prefers-reduced-motion:reduce){
    .cover{display:none}
    .book:not(.opened),.book:not(.opened) .page.left .content,.book:not(.opened) .page.left .folio{animation:none}
    .leaf{display:none}
  }

  /* ---------- tablette ---------- */
  @media (max-width:900px){
    .page{padding:36px 30px 50px}
    .toc a{font-size:.95rem;padding:4px}
    .toc .ch{display:none}
  }

  /* ---------- téléphone : le livre reste ouvert à l'horizontale ---------- */
  @media (max-width:640px){
    body{padding:14px 8px 30px}
    .topbar{margin-bottom:12px}
    .topbar .label{display:none}
    .back{font-size:.72rem;padding:6px 10px}
    .book{padding:5px;border-radius:6px}
    .spread{min-height:0}
    .spread::after{width:26px}
    .page{padding:20px 10px 30px}
    .page::before{inset:6px;outline-offset:2px}
    .folio{bottom:10px;font-size:.6rem}
    .title-page,.chapter-open{min-height:380px}
    .title-page .pre{font-size:.55rem;letter-spacing:.25em}
    .title-page h1{font-size:1.15rem;margin:8px 0 4px}
    .sigil{width:64px;height:64px;margin:14px auto}
    .title-page .motto{font-size:.72rem}
    h2{font-size:1rem}
    .rule{margin-bottom:8px}
    .toc a{font-size:.66rem;gap:4px;padding:3px 2px;line-height:1.2}
    .toc a:hover{padding-left:4px}
    .toc .code{font-size:.52rem;min-width:24px}
    .toc .dots{display:none}
    .toc li.last{margin-top:4px;padding-top:4px}
    .chapter-open .kicker{font-size:.55rem;letter-spacing:.2em}
    .chapter-open .big{font-size:2.6rem}
    .chapter-open h3{font-size:.85rem}
    .chapter-open .code{font-size:.65rem;padding:3px 8px}
    .chapter-body h4{font-size:.72rem}
    .chapter-body p{font-size:.74rem;line-height:1.45}
    .lettrine::first-letter{font-size:2rem;margin:3px 4px 0 0}
    .chapter-body .empty{font-size:.7rem;padding:10px}
    .chapter-head{margin-bottom:6px}
    .chapter-head .kicker{font-size:.5rem;letter-spacing:.2em}
    .chapter-head h3{font-size:.78rem;margin:4px auto 6px}
    .chapter-head .code{font-size:.55rem;padding:2px 6px}
    .definition .def-label{font-size:.5rem;margin-bottom:4px}
    .definition p{font-size:.6rem;line-height:1.4;text-align:left}
    .definition .lettrine::first-letter{font-size:1.6rem}
    .definition .empty{font-size:.65rem;padding:10px}
    .cats .cat{font-size:.6rem;gap:4px;padding:2px 1px;line-height:1.25}
    .cats .code{font-size:.46rem;min-width:36px}
    .nav{margin-top:12px}
    .nav button{padding:8px 10px;font-size:.7rem}
  }

  /* ---------- liste de tirages ---------- */
  .spreads .cat{align-items:center;padding:9px 6px}
  .spreads .minicards{margin-left:auto;display:flex;gap:3px}
  .spreads .minicards i{display:block;width:9px;height:14px;border:1px solid rgba(122,26,26,.6);border-radius:1.5px;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(122,26,26,.12))}
  @media (max-width:640px){
    .spreads .cat{flex-direction:column;align-items:flex-start;gap:3px;padding:4px 1px}
    .spreads .minicards{margin-left:0;gap:2px}
    .spreads .minicards i{width:5px;height:8px}
  }


  /* ---------- pages de tirage ---------- */
  .layout{position:relative;width:min(100%,300px);margin:6px auto 14px}
  .layout .lc{position:absolute;transform:translate(-50%,-50%);width:var(--cw);aspect-ratio:2/3;
    border:1px solid rgba(122,26,26,.7);border-radius:3px;
    background:linear-gradient(160deg,#fbf3dc,#e3cf9f);box-shadow:0 2px 4px rgba(60,35,10,.35);
    display:grid;place-items:center;font-family:'Cinzel',serif;font-weight:700;color:var(--red);font-size:.9rem}
  .layout .lc em{position:absolute;font-style:normal;font-family:'IM Fell English',serif;font-weight:400;color:var(--ink-soft);white-space:nowrap;font-size:.8rem}
  .layout.lbl-below .lc em{top:calc(100% + 3px);left:50%;transform:translateX(-50%)}
  .layout.lbl-right .lc em{left:calc(100% + 8px);top:50%;transform:translateY(-50%)}
  .layout.lbl-glyph .lc{font-size:.72rem}
  .layout.lbl-glyph .lc em{top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-size:.8rem;color:var(--red)}
  .layout .wheel{position:absolute;inset:11%;border:1px dashed rgba(122,26,26,.35);border-radius:50%}
  .layout .penta{position:absolute;inset:0;width:100%;height:100%}
  .layout .penta polygon{fill:none;stroke:rgba(122,26,26,.3);stroke-width:.6}
  .spread-text{font-size:1rem;line-height:1.55;text-align:justify;hyphens:auto}
  .spread-text.lettrine::first-letter{font-size:2.6rem}
  .def-label.first:first-child{margin-top:0}
  .positions .pos{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted rgba(90,63,36,.3)}
  .positions .pn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;margin-top:1px}
  .positions strong{display:block;font-family:'Cinzel',serif;font-size:.88rem;color:var(--red);letter-spacing:.03em}
  .positions span{display:block;font-size:.97rem;line-height:1.4}
  .spread-note{margin-top:10px;font-style:italic;font-size:.9rem;color:var(--ink-soft);border-left:2px solid rgba(122,26,26,.4);padding-left:10px}

  /* ---------- listes de cartes ---------- */
  .cats .refcount{margin-left:auto;font-style:italic;font-size:.82rem;color:var(--ink-soft);white-space:nowrap}
  .cats .refcount + .count{margin-left:8px}
  .sub-intro{font-style:italic;color:var(--ink-soft);font-size:.98rem;line-height:1.5;margin-bottom:6px}
  .card-entry{padding:8px 2px;border-bottom:1px dotted rgba(90,63,36,.35)}
  .ce-head{display:flex;gap:10px;align-items:baseline;margin-bottom:3px}
  .ce-num{font-family:'Cinzel',serif;font-weight:700;color:var(--red);font-size:.8rem;min-width:48px}
  .ce-name{font-family:'Cinzel',serif;font-weight:700;font-size:1rem;color:var(--ink)}
  .ce-row{display:flex;gap:8px;align-items:baseline;font-size:.95rem;line-height:1.35;padding-left:58px}
  .ce-tag{flex:0 0 66px;font-family:'Cinzel',serif;font-weight:700;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}
  .ce-tag.up{color:#2f5a2a}
  .ce-tag.rev{color:var(--red)}
  .add-inline{text-align:center;padding-top:14px}

  @media (max-width:640px){
    .layout{margin:2px auto 8px}
    .layout .lc{font-size:.5rem;border-radius:2px}
    .layout .lc em{font-size:.45rem}
    .layout.lbl-right .lc em{left:calc(100% + 4px)}
    .layout.lbl-glyph .lc{font-size:.4rem}
    .layout.lbl-glyph .lc em{font-size:.5rem}
    .spread-text{font-size:.6rem;line-height:1.4;text-align:left}
    .spread-text.lettrine::first-letter{font-size:1.5rem}
    .positions .pos{gap:4px;padding:3px 0}
    .positions .pn{flex-basis:13px;height:13px;font-size:.45rem}
    .positions strong{font-size:.52rem}
    .positions span{font-size:.58rem;line-height:1.3}
    .spread-note{font-size:.55rem;padding-left:5px}
    .cats .refcount{font-size:.5rem}
    .sub-intro{font-size:.58rem;line-height:1.35}
    .card-entry{padding:4px 0}
    .ce-head{gap:4px;margin-bottom:1px}
    .ce-num{font-size:.48rem;min-width:22px}
    .ce-name{font-size:.62rem}
    .ce-row{font-size:.56rem;line-height:1.3;padding-left:0;gap:4px}
    .ce-tag{flex:0 0 auto;min-width:34px;white-space:nowrap;font-size:.4rem;letter-spacing:0}
    .add-inline{padding-top:8px}
  }

  /* ---------- oracles ---------- */
  .definition p + p{margin-top:10px}
  .empty-note{font-style:italic;color:var(--ink-soft);text-align:center;margin:10px 0}
  .add-code{margin-top:6px;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.08em;color:var(--ink-soft)}
  .oracle-author{text-align:center;font-style:italic;color:var(--ink-soft);margin:-2px 0 8px}
  .oracle-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 4px}
  .ce-tools{margin-left:auto;display:flex;gap:2px;opacity:.55;transition:opacity .2s}
  .card-entry:hover .ce-tools{opacity:1}
  .ce-tools button{background:none;border:none;cursor:pointer;color:var(--red);font-size:.85rem;padding:2px 5px;border-radius:3px}
  .ce-tools button:hover{background:rgba(122,26,26,.1)}
  .ce-row.one{padding-left:58px;display:block}
  .linkish{background:none;border:none;color:var(--red);font-family:'IM Fell English',serif;font-style:italic;font-size:.95rem;cursor:pointer;text-decoration:underline;margin:-4px 0 6px;padding:0}
  @media (max-width:640px){
    .definition p + p{margin-top:5px}
    .add-code{font-size:.5rem}
    .oracle-author{font-size:.6rem}
    .oracle-tools{gap:3px}
    .ce-tools button{font-size:.55rem;padding:1px 3px}
    .ce-row.one{padding-left:26px}
    .empty-note{font-size:.6rem}
  }

  /* ---------- runes ---------- */
  .card-entry.glyphs .ce-head{align-items:center}
  .card-entry.glyphs .ce-num{font-family:'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',serif;font-weight:400;font-size:1.7rem;line-height:1;color:var(--red);text-align:center}
  .card-entry.glyphs .ce-row{margin-top:1px}
  .card-entry.glyphs .ce-tag{flex-basis:88px}
  .ce-tag:not(.up):not(.rev){color:var(--ink-soft)}
  @media (max-width:640px){
    .card-entry.glyphs .ce-num{font-size:1rem}
    .card-entry.glyphs .ce-tag{flex-basis:auto;min-width:0;margin-right:2px}
  }

  /* ---------- texte pratique (page droite) ---------- */
  .rt-intro{font-style:italic;color:var(--ink-soft);margin-bottom:8px}
  .steps{list-style:none}
  .steps li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted rgba(90,63,36,.3);font-size:1rem;line-height:1.45}
  .steps li:last-child{border-bottom:none}
  .steps .pn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;margin-top:1px}
  .warning-box{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border:1px solid rgba(122,26,26,.45);
    background:rgba(122,26,26,.07);border-radius:3px;font-size:.95rem;line-height:1.45}
  .warning-box .wi{font-size:1.2rem;color:var(--red);line-height:1}
  @media (max-width:640px){
    .rt-intro{font-size:.6rem;margin-bottom:4px}
    .steps li{gap:4px;padding:3px 0;font-size:.58rem;line-height:1.35}
    .steps .pn{flex-basis:13px;height:13px;font-size:.45rem}
    .warning-box{gap:4px;margin-top:6px;padding:5px 6px;font-size:.56rem;line-height:1.35}
    .warning-box .wi{font-size:.7rem}
  }

  /* ---------- tableau de nombres ---------- */
  .numtable .nt-row{display:flex;gap:14px;align-items:baseline;padding:5px 2px;border-bottom:1px dotted rgba(90,63,36,.3)}
  .numtable .nt-row:last-child{border-bottom:none}
  .numtable .nt-k{flex:0 0 38px;text-align:center;font-family:'Cinzel Decorative',serif;font-weight:700;font-size:1.25rem;color:var(--red);line-height:1}
  .numtable .nt-v{font-size:.98rem;line-height:1.4}
  @media (max-width:640px){
    .numtable .nt-row{gap:5px;padding:2px 0}
    .numtable .nt-k{flex-basis:16px;font-size:.7rem}
    .numtable .nt-v{font-size:.56rem;line-height:1.3}
  }

  .ch-note{margin:10px auto 0;max-width:34ch;font-style:italic;color:var(--ink-soft);font-size:.98rem;line-height:1.4}
  @media (max-width:640px){ .ch-note{font-size:.58rem;margin-top:5px} }

  /* ---------- texte long (traité) ---------- */
  .lt-h{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:700;font-size:1.08rem;color:var(--red);
    margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(122,26,26,.3)}
  .lt-n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--red);color:var(--paper);display:grid;place-items:center;font-size:.72rem}
  .lt-sym{font-size:1.1rem;color:var(--ink-soft);width:18px;text-align:center}
  .lt-p{font-size:1rem;line-height:1.55;text-align:justify;hyphens:auto;margin-bottom:8px}
  .lt-p.lettrine::first-letter{font-size:2.8rem}
  .lt-li{font-size:.98rem;line-height:1.5;padding:3px 0 3px 14px;position:relative}
  .lt-li::before{content:"✦";position:absolute;left:0;top:4px;font-size:.6rem;color:var(--red)}
  .lt-li strong{font-family:'Cinzel',serif;font-size:.86rem;color:var(--ink);letter-spacing:.02em}
  .lt-note{margin:8px 0 10px;padding:8px 12px;border-left:3px solid var(--red);background:rgba(122,26,26,.07);font-style:italic;font-size:.95rem;line-height:1.45}
  .lt-fig{margin:6px auto 10px;text-align:center}
  .lt-fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
  .lt-fig figcaption{font-style:italic;font-size:.82rem;color:var(--ink-soft);margin-top:3px}
  .fig-flux{width:320px}.fig-el{width:300px}.fig-yy{width:96px}.fig-ch{width:190px}
  .lt-fig .ln{fill:none;stroke:var(--red);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .lt-fig .ln.dim{stroke:rgba(122,26,26,.35)}
  .lt-fig .fl{fill:var(--red)}
  .lt-fig .lb text{font-family:'IM Fell English',serif;font-size:12px;fill:var(--ink-soft);text-anchor:middle}
  .lt-fig .lbl{font-family:'IM Fell English',serif;font-size:13px;fill:var(--ink)}
  @media (max-width:640px){
    .lt-h{font-size:.62rem;gap:4px;margin:7px 0 4px;padding-bottom:2px}
    .lt-n{flex-basis:13px;height:13px;font-size:.42rem}
    .lt-sym{font-size:.6rem;width:10px}
    .lt-p{font-size:.6rem;line-height:1.4;text-align:left;margin-bottom:4px}
    .lt-p.lettrine::first-letter{font-size:1.5rem}
    .lt-li{font-size:.58rem;line-height:1.35;padding:1px 0 1px 8px}
    .lt-li::before{font-size:.35rem;top:3px}
    .lt-li strong{font-size:.52rem}
    .lt-note{font-size:.56rem;padding:4px 6px;margin:4px 0 6px;border-left-width:2px}
    .lt-fig figcaption{font-size:.5rem}
    .fig-flux,.fig-el{width:150px}.fig-yy{width:50px}.fig-ch{width:100px}
  }

  /* ---------- fiches d'élément ---------- */
  .el-head{margin:0 auto 4px}
  .fig-tri{width:74px}
  .corr{margin:0}
  .corr + :not(.corr){margin-top:8px}
  .corr-row{display:flex;gap:10px;padding:3px 0;border-bottom:1px dotted rgba(90,63,36,.28);font-size:.95rem;line-height:1.35}
  .corr-row:last-child{border-bottom:none}
  .corr-k{flex:0 0 42%;font-family:'Cinzel',serif;font-size:.74rem;font-weight:700;color:var(--red);letter-spacing:.03em;padding-top:2px}
  @media (max-width:640px){
    .fig-tri{width:38px}
    .corr-row{gap:4px;padding:1px 0;font-size:.56rem}
    .corr-k{font-size:.44rem;padding-top:1px}
  }

  /* ---------- figures du corps ---------- */
  .fig-aura{width:110px}
  .glyph-row{font-size:1.9rem;letter-spacing:.35em;color:var(--red);line-height:1.2}
  .fig-moon{width:290px}
  .fig-clock{width:230px}
  .lt-fig .lbl.sm{font-size:10.5px;text-anchor:middle}
  .lt-fig .lbl.hr{font-size:8px;text-anchor:middle;fill:var(--ink-soft)}
  .big-glyph{font-size:4rem;line-height:1.1;color:var(--red);font-family:'Noto Serif SC','Songti SC','SimSun',serif}
  @media (max-width:640px){
    .fig-aura{width:60px}
    .glyph-row{font-size:1rem}
    .fig-moon{width:160px}
    .fig-clock{width:140px}
    .big-glyph{font-size:2.2rem}
  }

  /* ---------- outils (sauvegarde) ---------- */
  .tools{display:flex;gap:8px}
  .tool{font-family:'Cinzel',serif;font-weight:700;font-size:.72rem;letter-spacing:.08em;color:var(--gold);
    background:rgba(0,0,0,.35);border:1px solid rgba(212,168,75,.35);border-radius:3px;padding:6px 10px;cursor:pointer}
  .tool:hover{background:rgba(212,168,75,.15);color:var(--gold-light)}

  /* ---------- pages : défilement interne si une fiche est longue ---------- */
  .content{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(122,26,26,.35) transparent}
  .content::-webkit-scrollbar{width:5px}
  .content::-webkit-scrollbar-thumb{background:rgba(122,26,26,.35);border-radius:3px}

  /* catégories contenant des fiches */
  .cats a.cat{text-decoration:none;cursor:pointer;border-radius:3px;transition:background .2s,color .2s}
  .cats a.cat:hover,.cats a.cat:focus-visible{background:rgba(122,26,26,.08);color:var(--red);outline:none}
  .cats .count{margin-left:auto;align-self:center;font-family:'Cinzel',serif;font-weight:700;font-size:.7rem;color:var(--paper);
    background:var(--red);border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
  .cats .code.wide{min-width:92px}
  .def-label{font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;margin:14px 0 8px}

  .add-here{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;color:var(--ink-soft);font-style:italic;font-size:1.05rem}
  .add-here strong{font-style:normal;color:var(--red);font-family:'Cinzel',serif}

  /* ---------- fiche ---------- */
  .fiche-code{display:inline-block;font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;letter-spacing:.15em;color:var(--red);
    border:1px solid rgba(122,26,26,.4);padding:2px 10px;border-radius:2px}
  .fiche{text-align:left}
  .fiche .fiche-code{display:table;margin:0 auto}
  .fiche-name{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(1.4rem,2.6vw,2rem);color:var(--red);text-align:center;line-height:1.15;margin:10px 0 4px}
  .fiche-var{text-align:center;font-style:italic;color:var(--ink-soft);font-size:.98rem}
  .fiche-img{margin:16px auto 4px;width:min(100%,340px);aspect-ratio:4/3;border:1px solid rgba(122,26,26,.4);outline:1px solid rgba(122,26,26,.2);outline-offset:4px;
    background:rgba(255,255,255,.25);display:grid;place-items:center;overflow:hidden}
  .fiche-img img{width:100%;height:100%;object-fit:contain;filter:sepia(.12)}
  .fiche-img.empty span{font-style:italic;color:var(--ink-soft);font-size:.9rem}
  .fiche-desc{font-size:1.05rem;line-height:1.55;white-space:pre-line}
  .fiche-none{color:var(--ink-soft)}
  .fiche-path{text-align:center;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.08em;color:var(--ink-soft);line-height:1.5;
    padding-bottom:10px;border-bottom:1px solid rgba(122,26,26,.25)}
  .fiche-path em{font-family:'IM Fell English',serif;font-size:.95rem;letter-spacing:0;color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.92rem;padding:3px 10px;border:1px solid rgba(122,26,26,.4);border-radius:14px;background:rgba(122,26,26,.06);color:var(--ink)}
  .fiche-quote{font-style:italic;font-size:1.02rem;line-height:1.55;white-space:pre-line;border-left:3px solid rgba(122,26,26,.5);padding:4px 0 4px 14px;color:var(--ink)}
  .fiche-src{margin-top:8px;text-align:right;font-family:'Cinzel',serif;font-size:.8rem;color:var(--ink-soft)}
  .fiche-actions{display:flex;justify-content:center;gap:10px;margin-top:26px;padding-top:14px;border-top:1px solid rgba(122,26,26,.2)}

  /* ---------- boutons encre ---------- */
  .ink-btn{font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.06em;cursor:pointer;
    color:var(--paper);background:linear-gradient(180deg,#8a2020,var(--red));border:1px solid #4a0e0e;border-radius:3px;padding:9px 16px;
    box-shadow:0 2px 0 rgba(0,0,0,.25);transition:filter .2s,transform .1s}
  .ink-btn:hover{filter:brightness(1.12)}
  .ink-btn:active{transform:translateY(1px)}
  .ink-btn.small{font-size:.75rem;padding:6px 12px}
  .ink-btn.ghost{background:transparent;color:var(--red);border-color:rgba(122,26,26,.5);box-shadow:none}
  .ink-btn.danger{background:linear-gradient(180deg,#3a2a20,#1f140d);border-color:#000}
  .fiche-actions .ink-btn.danger{background:transparent;color:#6b1a1a;border-color:rgba(122,26,26,.4);box-shadow:none}

  /* ---------- plume ---------- */
  .quill{position:fixed;right:18px;bottom:18px;z-index:40;width:74px;height:74px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 40% 35%,#4a2912,#1c0e06);border:1px solid rgba(212,168,75,.6);
    box-shadow:0 10px 25px rgba(0,0,0,.6),0 0 18px rgba(212,168,75,.25);display:grid;place-items:center;padding:0;
    transition:transform .25s, box-shadow .25s}
  .quill svg{width:44px;height:64px;overflow:visible}
  .quill:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.7),0 0 28px rgba(243,200,110,.45)}
  .quill .feather{transform-origin:44px 104px;transition:transform .35s}
  .quill:hover .feather{transform:rotate(-8deg)}
  .quill-label{position:absolute;right:calc(100% + 10px);white-space:nowrap;font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;letter-spacing:.1em;
    color:var(--gold-light);background:rgba(0,0,0,.7);padding:5px 10px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s}
  .quill:hover .quill-label{opacity:1}
  /* grand écran : l'encrier et sa plume se posent à côté du livre */
  @media (min-width:1300px){
    .quill{position:absolute;right:auto;left:calc(50% + 570px);bottom:auto;top:calc(var(--book-bottom,760px) - 170px);width:96px;height:150px;border-radius:0;
      background:none;border:none;box-shadow:none}
    .quill svg{width:90px;height:140px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.7))}
    .quill:hover{box-shadow:none}
    .quill-label{right:auto;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;opacity:.85;background:none}
  }

  /* ---------- fenêtres ---------- */
  body.modal-on{overflow:hidden}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(10,5,2,.72);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
  .modal[hidden]{display:none}
  .sheet{position:relative;width:min(640px,100%);color:var(--ink);padding:34px 34px 26px;border-radius:4px;
    background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.3),transparent 60%),linear-gradient(180deg,var(--paper),var(--paper-dark));
    box-shadow:0 30px 60px rgba(0,0,0,.7), inset 0 0 0 1px rgba(122,26,26,.35), inset 0 0 0 6px rgba(239,224,187,.6), inset 0 0 0 7px rgba(122,26,26,.2);
    animation:sheetIn .3s ease both}
  .sheet.small{width:min(420px,100%);text-align:center;margin-top:18vh;font-size:1.1rem;line-height:1.5}
  .sheet.small strong{color:var(--red);font-family:'Cinzel',serif}
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sheet .x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:1.1rem;color:var(--ink-soft);cursor:pointer;padding:6px}
  .sheet h2{margin-bottom:2px}
  .code-prev{text-align:center;font-family:'Cinzel',serif;font-size:.85rem;color:var(--ink-soft);letter-spacing:.1em}
  .code-prev span{color:var(--red);font-weight:700}
  .sheet label,.sheet .field{display:block;margin-bottom:14px;font-family:'Cinzel',serif;font-weight:700;font-size:.78rem;letter-spacing:.08em;color:var(--ink-soft)}
  .sheet .lbl{display:block;margin-bottom:6px}
  .sheet .req{color:var(--red)}
  .sheet .hint{font-family:'IM Fell English',serif;font-weight:400;font-style:italic;letter-spacing:0;font-size:.85rem}
  .sheet input[type=text],.sheet input[type=url],.sheet select,.sheet textarea{
    display:block;width:100%;margin-top:6px;font-family:'IM Fell English',Georgia,serif;font-size:1.02rem;color:var(--ink);
    background:rgba(255,252,240,.65);border:1px solid rgba(122,26,26,.35);border-radius:3px;padding:8px 10px;letter-spacing:0}
  .sheet textarea{resize:vertical;line-height:1.45}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:2px solid rgba(122,26,26,.35);outline-offset:1px;background:#fffaf0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .img-row{display:flex;gap:14px;align-items:stretch}
  .img-prev{width:130px;min-width:130px;aspect-ratio:4/3;border:1px dashed rgba(122,26,26,.45);display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.3)}
  .img-prev img{width:100%;height:100%;object-fit:contain}
  .img-prev span{font-family:'IM Fell English',serif;font-weight:400;font-style:italic;letter-spacing:0;font-size:.85rem}
  .img-actions{flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .img-actions input{margin-top:0 !important}
  .ink-btn.file{display:inline-block;margin:0;color:var(--paper)}
  .warn{font-style:italic;font-size:.92rem;background:rgba(122,26,26,.08);border-left:3px solid var(--red);padding:6px 10px;margin-bottom:14px}
  .msg{min-height:1.2em;color:var(--red);font-style:italic;margin-bottom:6px}
  .sheet-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .sheet.small .sheet-actions{justify-content:center;margin-top:18px}

  @media (max-width:640px){
    .tools .tool{font-size:.6rem;padding:5px 7px}
    .quill{width:60px;height:60px;right:12px;bottom:12px}
    .quill svg{width:36px;height:54px}
    .quill-label{display:none}
    .def-label{font-size:.5rem;margin:6px 0 4px;letter-spacing:.2em}
    .cats .count{font-size:.5rem;min-width:14px;height:14px;padding:0 4px}
    .cats .code.wide{min-width:54px}
    .add-here{font-size:.72rem;gap:10px}
    .fiche-code{font-size:.5rem;padding:1px 5px}
    .fiche-name{font-size:.9rem;margin:6px 0 2px}
    .fiche-var{font-size:.62rem}
    .fiche-img{margin:8px auto 2px;outline-offset:2px}
    .fiche-img.empty span{font-size:.55rem}
    .fiche-desc,.fiche-quote{font-size:.62rem;line-height:1.4}
    .fiche-quote{padding-left:6px;border-left-width:2px}
    .fiche-path{font-size:.5rem;padding-bottom:5px}
    .fiche-path em{font-size:.62rem}
    .chip{font-size:.55rem;padding:1px 6px}
    .chips{gap:3px}
    .fiche-src{font-size:.5rem}
    .fiche-actions{flex-direction:column;align-items:stretch;gap:5px;margin-top:12px;padding-top:8px}
    .ink-btn.small{font-size:.58rem;padding:5px 6px}
    .sheet{padding:28px 16px 18px}
    .grid2{grid-template-columns:1fr}
    .img-row{flex-direction:column}
    .img-prev{width:100%;min-width:0}
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← La bibliothèque</a>
    <span class="label">GRIMOIRES · CODEX II</span>
    <div class="tools">
      <button type="button" class="tool" id="exportBtn" title="Télécharger une sauvegarde de toutes les fiches">⤓ Sauvegarder</button>
      <button type="button" class="tool" id="importBtn" title="Charger une sauvegarde de fiches">⤒ Charger</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <main class="book" id="book">
    <div class="spread" id="spread">
      <div class="cover" aria-hidden="true">

        { num:"◯", name:"Rune blanche (Wyrd)", rows:[["● Sens","L’inconnu, le destin encore à écrire.","up"],["◆ Note","Ajout moderne (Ralph Blum, 1982), absent des sources historiques ; beaucoup de pratiquants ne l’utilisent pas.",""]] }

    6: {
      glyph: true, unit: "variantes",
      intro: "Autres formes, usages et systèmes dérivés, historiques ou modernes.",
      cards: [
        { num:"ᚽ", name:"Runes à rameaux courts", rows:[["", "Variante suédo-norvégienne du Futhark récent, aux traits simplifiés, plus rapide à graver (par ex. sur la pierre de Rök)."]] },
        { num:"✦", name:"Runes de Hälsinge", rows:[["", "Variante suédoise (Xe – XIIe siècle) presque sans traits verticaux : une sorte de sténographie runique."]] },
        { num:"ᛀ", name:"Runes pointées", rows:[["", "Ajout d’un point à une rune pour noter un son voisin ; à l’origine de l’alphabet runique médiéval (D-03-04)."]] },
        { num:"✦", name:"Runes liées (bindrunes)", rows:[["", "Plusieurs runes combinées en un seul signe, pour gagner de la place ; très utilisées aujourd’hui comme symboles ou talismans."]] },
        { num:"✦", name:"Runes cryptiques", rows:[["", "Systèmes de codage (runes à rameaux, runes « de branches ») où chaque rune est désignée par sa famille (ætt) et sa position."]] },
        { num:"✦", name:"Futhorc frison", rows:[["", "Variante du futhorc employée en Frise, proche du système anglo-saxon."]] },
        { num:"✦", name:"Alphabet des Marcomans", rows:[["", "Liste runique transmise par des manuscrits carolingiens (IXe siècle), mêlant des formes anglo-saxonnes et continentales."]] },
        { num:"✦", name:"Runes Armanen", rows:[["", "Système moderne de 18 runes créé par l’occultiste Guido von List (1902–1908), sans fondement historique ; plusieurs de ses signes ont ensuite été repris par l’idéologie nationale-socialiste."]] }
      ]
    }
  };

  // Catégories de chaque chapitre (page de droite)
  const subcats = {
    "Tarot": {
      items: [
        "Arcanes majeurs",
        "Bâtons",
        "Coupes",
        "Deniers",
        "Épées"
      ]
    },
    "Runes": {
      items: [
        "Futhark ancien",
        "Futhorc anglo-saxon",
        "Futhark récent",
        "Runes médiévales",
        "Runes dalécarliennes",
        "Pratiques divinatoires runiques",
        "Autres systèmes & variantes"
      ]
    }
  };

  const PFX = CODEX.prefix;
  const pad = n => String(n).padStart(2,'0');
  const pad3 = n => String(n).padStart(3,'0');
  const roman = n => {
    const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IIII'],[1,'I']]; let r='';
    for(const [v,s] of m){while(n>=v){r+=s;n-=v}} return r;
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // oracles (et autres sous-catégories personnalisées) enregistrés dans le navigateur
  const CUSTOM_KEY = CODEX.storeKey.replace(/\.fiches$/,'') + '.custom';
  let custom = {};
  try { custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '{}') || {}; } catch(e){ custom = {}; }
  function saveCustom(){
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); return true; }
    catch(e){ return (e && (e.name==='QuotaExceededError' || e.code===22)) ? 'quota' : true; }
  }
  const isCustom = i => !!customSubs[chapters[i]];
  const customList = i => (custom[chapters[i]] = custom[chapters[i]] || []);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  // renvoie les noms des sous-catégories (null = supprimée : son numéro n'est jamais réutilisé)
  const subsOf = i => isCustom(i)
    ? customList(i).map(o => o.deleted ? null : esc(o.name))
    : (subcats[chapters[i]] || {items:[]}).items;
  const notesOf = i => (typeof chapterNotes !== 'undefined' && chapterNotes[chapters[i]]) || '';
  const liveSubs = i => subsOf(i).filter(x=>x!=null).length;
  const spreadsOf = i => ((leftLists[chapters[i]] || {items:[]}).items).filter(t=>t.positions);
  function refOf(i,k){
    if(isCustom(i)){
      const o = customList(i)[k];
      if(!o || o.deleted) return null;
      return { custom:true, oracle:o, unit:'cartes',
               intro: o.description ? esc(o.description) : '',
               cards: (o.cards||[]).map((c,j)=>({ id:c.id, num:j+1, name:esc(c.name), meaning:esc(c.meaning) })) };
    }
    return (refLists[chapters[i]] || {})[k] || null;
  }

  const spread = document.getElementById('spread');
  const tocBtn = document.getElementById('toc');
  const L = document.getElementById('left'), R = document.getElementById('right');
  const FL = document.getElementById('folioL'), FR = document.getElementById('folioR');
  const prev = document.getElementById('prev'), next = document.getElementById('next');

  /* =========================================================
     FICHES : stockage
     ========================================================= */
  const STORE_KEY = CODEX.storeKey;
  let storageOK = true;
  const FICHES_ON = CODEX.fiches !== false;
  let fiches = [];
  try {
    const rawData = localStorage.getItem(STORE_KEY);
    if (rawData && FICHES_ON) fiches = JSON.parse(rawData) || [];
  } catch (e) { storageOK = false; }
  if(!FICHES_ON){ const q = document.getElementById('quill'); if(q) q.remove(); }

  function saveFiches(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(fiches)); return true; }
    catch (e) {
      if (e && (e.name === 'QuotaExceededError' || e.code === 22)) return 'quota';
      storageOK = false; return true;   // stockage indisponible : on garde en mémoire
    }
  }

  const ficheCode = f => `${PFX}-${pad(f.cat+1)}-${pad(f.sub+1)}-${pad3(f.num)}`;
  const fichesOfSub = (i,k) => fiches.filter(f=>f.cat===i && f.sub===k).sort((a,b)=>a.num-b.num);
  const nextNum = (i,k) => fichesOfSub(i,k).reduce((m,f)=>Math.max(m,f.num),0) + 1;
  const subTextOf = (i,k) => (typeof subTexts !== 'undefined' && (subTexts[chapters[i]]||{})[k]) || null;
  const hasContent = (i,k) => !!refOf(i,k) || !!subTextOf(i,k) || fichesOfSub(i,k).length > 0;

  /* =========================================================
     Contenu des pages
     ========================================================= */
  const sigil = `<svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="48"/>
      <polygon points="60,14 100,83 20,83"/><polygon points="60,106 20,37 100,37"/>
      <circle cx="60" cy="60" r="14"/></svg>`;

  const homeLeft = () => `
      <div class="title-page">
        <div class="pre">CODEX ${CODEX.num}</div>
        <h1>${CODEX.titleHTML}</h1>
        ${sigil}
        <p class="motto">${CODEX.motto}</p>
      </div>`;

  const homeRight = () => `
      <h2>Sommaire</h2>
      <div class="rule"></div>
      <ol class="toc cats">
        ${chapters.map((c,i)=> CODEX.tocLinks === false ? `
          <li>
            <div class="cat">
              <span class="code">${PFX}-${pad(i+1)}</span>
              <span class="name">${c}</span>
            </div>
          </li>` : `
          <li>
            <a class="cat has" href="#${PFX}-${pad(i+1)}" data-go="${PFX}-${pad(i+1)}">
              <span class="code">${PFX}-${pad(i+1)}</span>
              <span class="name">${c}</span>
              <span class="refcount">→</span>
            </a>
          </li>`).join('')}
      </ol>`;

  const longOf = i => (typeof longTexts !== 'undefined' && longTexts[chapters[i]]) || null;
  function chapterHead(i){
    return `
      <div class="chapter-head">
        <div class="kicker">CHAPITRE ${roman(i+1)}</div>
        <h3>${chapters[i]}</h3>
        <div class="code">${PFX}-${pad(i+1)}</div>
        ${notesOf(i) ? `<p class="ch-note">${notesOf(i)}</p>` : ''}
      </div>
      <div class="rule"></div>`;
  }
  function chapterLeft(i){
    const c = chapters[i], code = PFX+'-'+pad(i+1);
    const def = definitions[c];
    const ll = leftLists[c];
    return `${chapterHead(i)}
      ${def || !ll ? `
      <div class="definition">
        <div class="def-label">Définition</div>
        ${def
          ? def.split(/\n\s*\n/).map((para,j)=>`<p class="${j?'':'lettrine'}">${para}</p>`).join('')
          : `<div class="empty">✦ Définition à venir ✦</div>`}
      </div>` : ''}
      ${ll ? `
      <div class="def-label">${ll.title}</div>
      <ol class="toc cats spreads">
        ${ll.items.map(t=>{
          const inner = `<span class="name">${t.name}</span>
            <span class="minicards" aria-hidden="true">${'<i></i>'.repeat(t.cards)}</span>`;
          return t.positions
            ? `<li><a class="cat has" href="#${code}-${t.id}" data-go="${code}-${t.id}">${inner}</a></li>`
            : `<li><div class="cat">${inner}</div></li>`;
        }).join('')}
      </ol>` : ''}`;
  }

  function chapterRight(i){
    const rt = rightTexts[chapters[i]];
    if(rt) return `
      <h2>${rt.title}</h2>
      <div class="rule"></div>
      ${rt.intro ? `<p class="rt-intro">${rt.intro}</p>` : ''}
      ${rt.steps ? `<ol class="steps">${rt.steps.map((t,j)=>`<li><span class="pn">${j+1}</span><span>${t}</span></li>`).join('')}</ol>` : ''}
      ${(rt.sections||[]).map(sec=>`
        <div class="def-label">${sec.label}</div>
        <div class="numtable">${sec.rows.map(r=>`<div class="nt-row"><span class="nt-k">${r[0]}</span><span class="nt-v">${r[1]}</span></div>`).join('')}</div>`).join('')}
      ${rt.warning ? `<div class="warning-box"><span class="wi">⚠</span><span>${rt.warning}</span></div>` : ''}`;
    const items = subsOf(i);
    const cs = customSubs[chapters[i]];
    if(!items.length && !cs) return '';
    return `
      <h2>${cs ? cs.title : 'Catégories'}</h2>
