<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex des Entités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d4a84b;
    --gold-light:#f3d98b;
    --ink:#2b1a0e;
    --ink-soft:#5a3f24;
    --red:#7a1a1a;
    --paper:#efe0bb;
    --paper-dark:#d9c393;
    --leather:#5a1212;
    --leather-dark:#2e0707;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'IM Fell English',Georgia,serif;
    color:var(--paper);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,170,60,.16), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.85), transparent 70%),
      repeating-linear-gradient(90deg,#1c0e06 0 3px,#22120a 3px 90px,#1a0c05 90px 93px,#24140b 93px 180px),
      #1a0c05;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 50px;
    overflow-x:hidden;
  }

  /* ---------- barre du haut ---------- */
  .topbar{
    width:min(1100px,100%);
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-bottom:22px;
  }
  .back{
    font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.12em;
    color:var(--gold);text-decoration:none;
    padding:8px 14px;border:1px solid rgba(212,168,75,.5);border-radius:3px;
    background:rgba(0,0,0,.35);
    transition:background .25s,color .25s;
  }
  .back:hover{background:rgba(212,168,75,.15);color:var(--gold-light)}
  .topbar .label{font-family:'Cinzel',serif;color:#b99a62;font-size:.8rem;letter-spacing:.2em}

  /* ---------- le livre ouvert ---------- */
  .book{
    width:min(1100px,100%);
    position:relative;
    padding:14px;
    background:linear-gradient(180deg,#6e1818,var(--leather) 40%,var(--leather-dark));
    border-radius:10px;
    box-shadow:0 30px 70px rgba(0,0,0,.75), inset 0 0 0 2px rgba(212,168,75,.35), inset 0 0 30px rgba(0,0,0,.6);
    perspective:3200px;
  }
  .spread{
    display:grid;grid-template-columns:1fr 1fr;
    min-height:640px;
    position:relative;
    perspective:3200px;
  }
  .spread::after{ /* pli central */
    content:"";position:absolute;top:0;bottom:0;left:50%;width:60px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,rgba(60,35,10,.35) 40%,rgba(30,15,5,.55) 50%,rgba(60,35,10,.35) 60%,transparent);
    pointer-events:none;z-index:3;
  }
  .page{
    position:relative;
    padding:48px 52px 60px;
    background:
      radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.25),transparent 60%),
      radial-gradient(ellipse at 80% 90%,rgba(120,80,30,.18),transparent 55%),
      linear-gradient(180deg,var(--paper),var(--paper-dark));
    color:var(--ink);
    overflow:hidden;
  }
  .page.left{border-radius:4px 0 0 4px;box-shadow:inset -18px 0 30px -18px rgba(60,35,10,.55)}
  .page.right{border-radius:0 4px 4px 0;box-shadow:inset 18px 0 30px -18px rgba(60,35,10,.55)}
  .page::before{ /* cadre ornemental */
    content:"";position:absolute;inset:18px;
    border:1px solid rgba(122,26,26,.35);
    outline:1px solid rgba(122,26,26,.18);outline-offset:4px;
    pointer-events:none;
  }
  .folio{
    position:absolute;bottom:26px;left:0;right:0;text-align:center;
    font-family:'Cinzel',serif;font-size:.8rem;color:var(--ink-soft);letter-spacing:.2em
  }

  /* contenu animé */
  .content{animation:turn .55s ease both;height:100%}
  .page.right .content{animation-delay:.08s}
  @keyframes turn{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

  /* ---------- page de titre ---------- */
  .title-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;min-height:520px}
  .title-page .pre{font-family:'Cinzel',serif;letter-spacing:.4em;font-size:.9rem;color:var(--ink-soft)}
  .title-page h1{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(2rem,4vw,3.2rem);line-height:1.1;margin:14px 0 6px;
    color:var(--red);
  }
  .title-page .num{font-family:'Cinzel Decorative',serif;font-size:1.6rem;color:var(--ink)}
  .sigil{width:130px;height:130px;margin:26px auto}
  .sigil circle,.sigil path,.sigil polygon{fill:none;stroke:var(--red);stroke-width:1.4}
  .title-page .motto{font-style:italic;font-size:1.1rem;color:var(--ink-soft);max-width:30ch}

  .lettrine::first-letter{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    float:left;font-size:3.4rem;line-height:.85;margin:6px 8px 0 0;color:var(--red);
  }

  /* ---------- sommaire ---------- */
  h2{
    font-family:'Cinzel Decorative',serif;font-weight:700;
    font-size:1.6rem;text-align:center;color:var(--red);margin-bottom:6px;
  }
  .rule{height:10px;margin:0 auto 18px;width:70%;
    background:
      radial-gradient(circle,var(--red) 2.5px,transparent 3.5px) center/10px 10px no-repeat,
      linear-gradient(90deg,transparent,rgba(122,26,26,.6) 20%,rgba(122,26,26,.6) 80%,transparent) center/100% 1px no-repeat}
  .toc{list-style:none}
  .toc li{margin:0}
  .toc a{
    display:flex;align-items:baseline;gap:10px;
    padding:6px 6px;
    color:var(--ink);text-decoration:none;
    border-radius:3px;
    transition:background .2s,color .2s,padding-left .2s;
    font-size:1.08rem;
  }
  .toc a:hover,.toc a:focus-visible{background:rgba(122,26,26,.09);color:var(--red);padding-left:12px;outline:none}
  .toc .code{font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;color:var(--red);min-width:42px}
  .toc .name{flex:0 1 auto}
  .toc .dots{flex:1;border-bottom:1px dotted rgba(90,63,36,.55);transform:translateY(-4px);min-width:16px}
  .toc .ch{font-family:'Cinzel',serif;font-size:.8rem;color:var(--ink-soft)}
  .toc li.last{margin-top:8px;padding-top:8px;border-top:1px solid rgba(122,26,26,.2)}

  /* ---------- page de chapitre ---------- */
  .chapter-open{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:520px}
  .chapter-open .kicker{font-family:'Cinzel',serif;letter-spacing:.35em;font-size:.85rem;color:var(--ink-soft)}
  .chapter-open .big{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(4rem,9vw,6.5rem);line-height:1;color:var(--red);margin:10px 0;
    text-shadow:0 2px 0 rgba(0,0,0,.08);
  }
  .chapter-open h3{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--ink);max-width:18ch;line-height:1.25}
  .chapter-open .code{margin-top:14px;font-family:'Cinzel',serif;font-weight:700;color:var(--red);letter-spacing:.2em;
    border-top:1px solid rgba(122,26,26,.4);border-bottom:1px solid rgba(122,26,26,.4);padding:4px 12px}

  .chapter-body h4{font-family:'Cinzel',serif;font-weight:700;color:var(--red);font-size:1.1rem;margin:0 0 10px;letter-spacing:.06em}
  .chapter-body p{font-size:1.1rem;line-height:1.6;margin-bottom:14px;color:var(--ink)}
  .chapter-body .empty{
    margin-top:18px;padding:18px;text-align:center;
    border:1px dashed rgba(122,26,26,.4);border-radius:4px;
    font-style:italic;color:var(--ink-soft)
  }

  /* ---------- chapitre : définition à gauche ---------- */
  .chapter-head{text-align:center;margin-bottom:14px}
  .chapter-head .kicker{font-family:'Cinzel',serif;letter-spacing:.35em;font-size:.8rem;color:var(--ink-soft)}
  .chapter-head h3{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(1.3rem,2.4vw,1.75rem);color:var(--red);line-height:1.2;margin:8px auto 10px;max-width:20ch}
  .chapter-head .code{display:inline-block;font-family:'Cinzel',serif;font-weight:700;color:var(--red);letter-spacing:.2em;font-size:.85rem;
    border-top:1px solid rgba(122,26,26,.4);border-bottom:1px solid rgba(122,26,26,.4);padding:3px 12px}
  .definition .def-label{font-family:'Cinzel',serif;font-weight:700;font-size:.75rem;letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:8px}
  .definition p{font-size:1.02rem;line-height:1.55;text-align:justify;hyphens:auto;color:var(--ink)}
  .definition .empty{margin-top:10px;padding:18px;text-align:center;border:1px dashed rgba(122,26,26,.4);border-radius:4px;font-style:italic;color:var(--ink-soft)}

  /* ---------- catégories (page droite) ---------- */
  .cats .cat{display:flex;align-items:baseline;gap:10px;padding:5px 6px;font-size:1.02rem;color:var(--ink);border-bottom:1px dotted rgba(90,63,36,.3)}
  .cats li:last-child .cat{border-bottom:none}
  .cats .code{font-family:'Cinzel',serif;font-weight:700;font-size:.78rem;color:var(--red);min-width:62px;white-space:nowrap}

  /* ---------- navigation ---------- */
  .nav{
    width:min(1100px,100%);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:20px;
  }
  .nav button{
    font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:.1em;
    color:var(--gold);background:rgba(0,0,0,.35);
    border:1px solid rgba(212,168,75,.5);border-radius:3px;
    padding:10px 16px;cursor:pointer;
    transition:background .25s,color .25s,opacity .25s;
  }
  .nav button:hover:not(:disabled){background:rgba(212,168,75,.15);color:var(--gold-light)}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav .mid{flex:0 0 auto}

  /* ---------- couverture (ouverture) ---------- */
  .cover{
    position:absolute;top:0;bottom:0;left:50%;right:0;
    transform-origin:left center;
    transform-style:preserve-3d;
    z-index:10;
    pointer-events:none;
    animation:openCover 1.6s cubic-bezier(.6,.05,.3,1) .35s forwards;
  }
  .cover .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:0 8px 8px 0;
  }
  .cover .front{
    background:
      radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.12),transparent 60%),
      linear-gradient(90deg,#3a0909,#6e1818 12%,var(--leather) 60%,var(--leather-dark));
    box-shadow:inset 0 0 0 2px rgba(212,168,75,.45), inset 0 0 0 10px rgba(0,0,0,.15), inset 0 0 40px rgba(0,0,0,.6), 12px 10px 30px rgba(0,0,0,.6);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;color:var(--gold);padding:10px;
  }
  .cover .front::before{content:"";position:absolute;inset:16px;border:1px solid rgba(212,168,75,.5);border-radius:4px}
  .cover .front .ct{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(1rem,3.4vw,2.4rem);line-height:1.15;text-shadow:0 2px 0 #000}
  .cover .front .cn{font-family:'Cinzel Decorative',serif;font-size:clamp(.9rem,2.4vw,1.6rem);color:var(--gold-light)}
  .cover .front svg{width:clamp(50px,12vw,120px);height:auto}
  .cover .front svg *{fill:none;stroke:var(--gold);stroke-width:1.4}
  .cover .back{
    transform:rotateY(180deg);border-radius:8px 0 0 8px;
    background:
      repeating-radial-gradient(circle at 30% 40%,#5b2a2a 0 6px,#4a1d1d 6px 12px,#6a3232 12px 16px),
      #4a1d1d;
    box-shadow:inset 0 0 0 10px #3a0e0e, inset 0 0 30px rgba(0,0,0,.6);
  }
  @keyframes openCover{
    0%{transform:rotateY(0)}
    100%{transform:rotateY(-180deg)}
  }
  .cover .back{animation:fadeBack .35s ease 1.8s forwards}
  @keyframes fadeBack{to{opacity:0}}
  .opened .cover{display:none}

  /* livre fermé au départ : seule la couverture est visible, centrée */
  .book:not(.opened){
    animation:openBook 1.6s cubic-bezier(.6,.05,.3,1) .35s both;
  }
  .book:not(.opened) .page.left .content,
  .book:not(.opened) .page.left .folio{animation:revealLeft 1.6s linear .35s both}
  @keyframes openBook{
    0%  {transform:translateX(-25%);clip-path:inset(-30% -30% -30% 50%)}
    40% {transform:translateX(-18%);clip-path:inset(-30% -30% -30% 50%)}
    100%{transform:translateX(0);   clip-path:inset(-30% -30% -30% -30%)}
  }
  @keyframes revealLeft{0%,55%{opacity:0}100%{opacity:1}}

  /* ---------- feuille qui tourne ---------- */
  .leaf{
    position:absolute;top:0;bottom:0;width:50%;
    z-index:8;pointer-events:none;
    background:linear-gradient(180deg,var(--paper),var(--paper-dark));
    box-shadow:0 0 25px rgba(0,0,0,.35);
  }
  .leaf.next{left:50%;transform-origin:left center;animation:leafNext .6s ease-in-out forwards;
    background:linear-gradient(90deg,rgba(60,35,10,.35),transparent 20%),linear-gradient(180deg,var(--paper),var(--paper-dark))}
  .leaf.prev{left:0;transform-origin:right center;animation:leafPrev .6s ease-in-out forwards;
    background:linear-gradient(270deg,rgba(60,35,10,.35),transparent 20%),linear-gradient(180deg,var(--paper),var(--paper-dark))}
  .leaf::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent);animation:shade .6s ease-in-out forwards}
  @keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
  @keyframes leafNext{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
  @keyframes leafPrev{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}

  @media (prefers-reduced-motion:reduce){
    .cover{display:none}
    .book:not(.opened),.book:not(.opened) .page.left .content,.book:not(.opened) .page.left .folio{animation:none}
    .leaf{display:none}
  }

  /* ---------- tablette ---------- */
  @media (max-width:900px){
    .page{padding:36px 30px 50px}
    .toc a{font-size:.95rem;padding:4px}
    .toc .ch{display:none}
  }

  /* ---------- téléphone : le livre reste ouvert à l'horizontale ---------- */
  @media (max-width:640px){
    body{padding:14px 8px 30px}
    .topbar{margin-bottom:12px}
    .topbar .label{display:none}
    .back{font-size:.72rem;padding:6px 10px}
    .book{padding:5px;border-radius:6px}
    .spread{min-height:0}
    .spread::after{width:26px}
    .page{padding:20px 10px 30px}
    .page::before{inset:6px;outline-offset:2px}
    .folio{bottom:10px;font-size:.6rem}
    .title-page,.chapter-open{min-height:380px}
    .title-page .pre{font-size:.55rem;letter-spacing:.25em}
    .title-page h1{font-size:1.15rem;margin:8px 0 4px}
    .sigil{width:64px;height:64px;margin:14px auto}
    .title-page .motto{font-size:.72rem}
    h2{font-size:1rem}
    .rule{margin-bottom:8px}
    .toc a{font-size:.66rem;gap:4px;padding:3px 2px;line-height:1.2}
    .toc a:hover{padding-left:4px}
    .toc .code{font-size:.52rem;min-width:24px}
    .toc .dots{display:none}
    .toc li.last{margin-top:4px;padding-top:4px}
    .chapter-open .kicker{font-size:.55rem;letter-spacing:.2em}
    .chapter-open .big{font-size:2.6rem}
    .chapter-open h3{font-size:.85rem}
    .chapter-open .code{font-size:.65rem;padding:3px 8px}
    .chapter-body h4{font-size:.72rem}
    .chapter-body p{font-size:.74rem;line-height:1.45}
    .lettrine::first-letter{font-size:2rem;margin:3px 4px 0 0}
    .chapter-body .empty{font-size:.7rem;padding:10px}
    .chapter-head{margin-bottom:6px}
    .chapter-head .kicker{font-size:.5rem;letter-spacing:.2em}
    .chapter-head h3{font-size:.78rem;margin:4px auto 6px}
    .chapter-head .code{font-size:.55rem;padding:2px 6px}
    .definition .def-label{font-size:.5rem;margin-bottom:4px}
    .definition p{font-size:.6rem;line-height:1.4;text-align:left}
    .definition .lettrine::first-letter{font-size:1.6rem}
    .definition .empty{font-size:.65rem;padding:10px}
    .cats .cat{font-size:.6rem;gap:4px;padding:2px 1px;line-height:1.25}
    .cats .code{font-size:.46rem;min-width:36px}
    .nav{margin-top:12px}
    .nav button{padding:8px 10px;font-size:.7rem}
  }
</style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">← La bibliothèque</a>
    <span class="label">GRIMOIRES · CODEX I</span>
  </div>

  <main class="book" id="book">
    <div class="spread" id="spread">
      <div class="cover" aria-hidden="true">
        <div class="face front">
          <div class="cn">I</div>
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="48"/><polygon points="60,14 100,83 20,83"/><polygon points="60,106 20,37 100,37"/><circle cx="60" cy="60" r="14"/></svg>
          <div class="ct">Codex<br>des Entités</div>
        </div>
        <div class="face back"></div>
      </div>
      <section class="page left"><div class="content" id="left"></div><div class="folio" id="folioL"></div></section>
      <section class="page right"><div class="content" id="right"></div><div class="folio" id="folioR"></div></section>
    </div>
  </main>

  <nav class="nav" aria-label="Navigation du codex">
    <button id="prev" type="button">← Précédent</button>
    <button id="toc" class="mid" type="button">Sommaire</button>
    <button id="next" type="button">Suivant →</button>
  </nav>

<script>
  // Chapitres : ordre alphabétique, "Autres / inclassables" toujours à la fin
  const raw = [
    "Anges & créatures célestes",
    "Dieux & divinités",
    "Diable, démons & légions",
    "Élémentaires",
    "Esprits",
    "Nature",
    "Entités féeriques",
    "Entités mythologiques & folkloriques",
    "Gardiens, protecteurs & animaux-totems",
    "Entités psychiques & créées",
    "Entités cosmiques & primordiales",
    "Entités planétaires & stellaires",
    "Entités intermédiaires"
  ];
  const coll = new Intl.Collator('fr',{sensitivity:'base'});
  const chapters = [...raw].sort(coll.compare);
  chapters.push("Autres / inclassables");

  // Définitions de chaque chapitre (clé = titre exact du chapitre)
  const definitions = {
    "Anges & créatures célestes":
      "Cette catégorie regroupe les êtres décrits comme appartenant aux sphères célestes, aux cieux ou à des réalités spirituelles associées au domaine céleste dans différentes traditions religieuses, mythologiques et ésotériques. Elle comprend notamment les anges, archanges, chérubins, séraphins ainsi que d’autres ordres ou créatures célestes décrits par certaines traditions. Ces entités peuvent être associées à des fonctions telles que la protection, la transmission de messages, la guidance, le jugement ou l’accomplissement d’une fonction divine ou cosmique. Leur nature, leur hiérarchie, leurs fonctions et leur relation avec les divinités varient fortement selon les traditions, les textes et les interprétations. Dans ce codex, chaque entité sera étudiée selon sa tradition d’origine, sa nature, son rang ou sa fonction, ses attributs, ses symboles, ses sources et les différentes conceptions qui lui sont associées.",
    "Diable, démons & légions":
      "Cette catégorie regroupe les figures et entités associées aux notions de démon, d’enfer, de tentation, d’opposition ou de forces infernales dans différentes traditions religieuses, démonologiques et ésotériques. Elle comprend notamment le Diable ou les figures équivalentes, les démons individuels ainsi que les groupes, hiérarchies ou « légions » décrits dans certaines sources. Les caractéristiques, fonctions et classifications de ces entités varient considérablement selon les religions, les époques, les textes et les courants occultes qui les décrivent. Certaines traditions les présentent comme des êtres spirituels autonomes, tandis que d’autres les interprètent comme des symboles, des forces ou des représentations du mal et du désordre. Dans ce codex, chaque entité sera étudiée selon sa tradition d’origine, ses sources, son nom, ses attributs, sa fonction et les différentes interprétations qui lui sont associées.",
    "Dieux & divinités":
      "Cette catégorie regroupe les êtres considérés comme divins ou sacrés au sein de différentes traditions religieuses, mythologiques et spirituelles. Elle comprend notamment les dieux, déesses, divinités mineures, divinités locales, figures divinisées ainsi que certaines puissances personnifiant des aspects du monde, de la nature ou de l’existence. Une divinité peut être associée à un domaine particulier ou posséder plusieurs fonctions et domaines selon les traditions et les sources. Sa nature, sa place dans la cosmologie, ses attributs et son statut peuvent varier selon les cultures, les époques et les courants qui la décrivent. Dans ce codex, chaque divinité sera étudiée selon sa tradition d’origine, ses noms et formes, ses domaines, ses fonctions, ses attributs, ses symboles et les différentes conceptions qui lui sont associées.",
    "Élémentaires":
      "Cette catégorie regroupe les entités traditionnellement associées aux éléments fondamentaux de la nature ou à certaines forces élémentaires dans différentes traditions et systèmes ésotériques. Elle comprend notamment les êtres liés à la Terre, à l’Eau, à l’Air et au Feu, ainsi que, selon certains systèmes, à l’Éther ou à d’autres principes. Les élémentaires peuvent être décrits comme des esprits, des êtres autonomes, des manifestations d’une force naturelle ou des représentations symboliques d’un élément. Leur nature, leur classification, leurs caractéristiques et leurs fonctions varient fortement selon les traditions, les courants ésotériques et les interprétations modernes. Dans ce codex, chaque élémentaire sera étudié selon son élément ou principe associé, sa tradition d’origine, ses caractéristiques, ses fonctions, ses symboles et les différentes conceptions qui lui sont attribuées.",
    "Entités cosmiques & primordiales":
      "Cette catégorie regroupe les êtres, puissances ou forces décrits comme liés aux origines, aux fondements ou aux grandes structures de l’existence et du cosmos dans différentes traditions et cosmologies. Elle comprend notamment les entités dites primordiales, associées à des concepts fondamentaux tels que le chaos, le temps, l’espace, la création, la destruction, la lumière, les ténèbres ou les forces originelles. Certaines traditions les présentent comme antérieures aux dieux, tandis que d’autres les considèrent comme des divinités ou des principes cosmiques personnifiés. Leur nature et leur place dans la cosmologie varient fortement selon les traditions ; le terme « primordial » ne possède donc pas de définition universelle. Dans ce codex, chaque entité sera étudiée selon son origine, sa tradition, sa place dans la cosmologie, les principes auxquels elle est associée, ses attributs, ses relations et les différentes interprétations qui lui sont attribuées.",
    "Entités féeriques":
      "Cette catégorie regroupe les êtres issus des traditions et folklores décrivant des peuples ou esprits féeriques, souvent associés à des royaumes invisibles, à la nature ou à des lieux particuliers. Elle comprend notamment les fées, elfes, lutins, korrigans, brownies, pixies et autres êtres pouvant être rattachés au monde féerique selon les cultures et les sources. Ces entités peuvent être décrites comme bienveillantes, neutres, malicieuses ou dangereuses, et leurs relations avec les humains varient fortement d’un folklore à l’autre. Le terme « féerique » ne désigne donc pas une espèce unique ni un système universel : les classifications, caractéristiques et noms diffèrent selon les régions et les traditions. Dans ce codex, chaque entité sera étudiée selon sa tradition ou son folklore d’origine, son type, son environnement, ses caractéristiques, ses comportements, ses symboles et les différentes versions rapportées à son sujet.",
    "Entités intermédiaires":
      "Cette catégorie regroupe les entités dont la fonction principale est d’assurer un lien, une transmission ou un passage entre différents mondes, plans, domaines ou états d’existence selon les traditions. Elle comprend notamment les messagers, guides, intermédiaires, psychopompes, passeurs et gardiens de portes ou de seuils. Certaines peuvent transmettre des messages, accompagner les défunts, guider des voyageurs ou surveiller l’accès à un lieu ou à un domaine particulier. Leur nature peut être céleste, divine, spirituelle, infernale ou autre : c’est principalement leur fonction d’intermédiaire ou de gardien d’un passage qui justifie leur classement dans cette catégorie. Dans ce codex, chaque entité sera étudiée selon sa fonction, ce qu’elle relie ou protège, sa tradition d’origine, son domaine d’intervention, ses attributs, ses symboles et les différentes conceptions qui lui sont associées.",
    "Entités mythologiques & folkloriques":

    "Entités planétaires & stellaires":

    "Entités psychiques & créées":

    "Esprits":

    "Gardiens, protecteurs & animaux-totems":

  const pad = n => String(n).padStart(2,'0');
  const roman = n => {
    const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IIII'],[1,'I']]; let r='';
    for(const [v,s] of m){while(n>=v){r+=s;n-=v}} return r;
  };

  const spread = document.getElementById('spread');
  const tocBtn = document.getElementById('toc');
  const L = document.getElementById('left'), R = document.getElementById('right');
  const FL = document.getElementById('folioL'), FR = document.getElementById('folioR');
  const prev = document.getElementById('prev'), next = document.getElementById('next');

  const sigil = `<svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56"/><circle cx="60" cy="60" r="48"/>
      <polygon points="60,14 100,83 20,83"/><polygon points="60,106 20,37 100,37"/>
      <circle cx="60" cy="60" r="14"/></svg>`;

  const homeLeft = () => `
      <div class="title-page">
        <div class="pre">CODEX I</div>
        <h1>Codex<br>des Entités</h1>
        ${sigil}
        <p class="motto">Registre des êtres visibles et invisibles, des cieux jusqu'aux abîmes.</p>
      </div>`;
  const homeRight = () => `
      <h2>Sommaire</h2>
      <div class="rule"></div>
      <ol class="toc cats">
        ${chapters.map((c,i)=>`
          <li>
            <div class="cat">
              <span class="code">E-${pad(i+1)}</span>
              <span class="name">${c}</span>
            </div>
          </li>`).join('')}
      </ol>`;

  function renderHome(){
    L.innerHTML = homeLeft();
    R.innerHTML = homeRight();
    FL.textContent = '';
    FR.textContent = '— i —';
    prev.disabled = true;
    next.disabled = false;
  }

  function chapterLeft(i){
    const c = chapters[i], code = 'E-'+pad(i+1);
    const def = definitions[c];
    return `
      <div class="chapter-head">
        <div class="kicker">CHAPITRE ${roman(i+1)}</div>
        <h3>${c}</h3>
        <div class="code">${code}</div>
      </div>
      <div class="rule"></div>
      <div class="definition">
        <div class="def-label">Définition</div>
        ${def
          ? `<p class="lettrine">${def}</p>`
          : `<div class="empty">✦ Définition à venir ✦</div>`}
      </div>`;
  }

  function chapterRight(i){
    const sc = subcats[chapters[i]];
    if(!sc) return '';
    return `
      <h2>Catégories</h2>
      <div class="rule"></div>
      <ol class="toc cats">
        ${sc.items.map((t,k)=>`
          <li>
            <div class="cat">
              <span class="code">E-${pad(i+1)}-${pad(k+1)}</span>
              <span class="name">${t}</span>
            </div>
          </li>`).join('')}
      </ol>`;
  }

  function renderChapter(i){
    L.innerHTML = chapterLeft(i);
    R.innerHTML = chapterRight(i);
    FL.textContent = `— ${2*i+2} —`;
    FR.textContent = `— ${2*i+3} —`;
    prev.disabled = false;
    next.disabled = i === chapters.length-1;
  }

  // Toutes les pages ont la même hauteur : celle de la page la plus longue
  function fixHeight(){
    const ref = document.querySelector('.page.left');
    const probe = ref.cloneNode(false);
    probe.style.cssText = `position:absolute;visibility:hidden;left:0;top:0;height:auto;width:${ref.getBoundingClientRect().width}px`;
    const inner = document.createElement('div');
    probe.appendChild(inner);
    spread.appendChild(probe);
    let max = 0;
    const measure = html => { inner.innerHTML = html; max = Math.max(max, probe.offsetHeight); };
    chapters.forEach((_,i)=>measure(chapterLeft(i)));
    measure(homeLeft());
    measure(homeRight());
    chapters.forEach((_,i)=>measure(chapterRight(i)));
    probe.remove();
    spread.style.height = Math.ceil(max) + 'px';
  }

  function current(){
    const m = location.hash.match(/^#E-(\d{2})$/);
    if(!m) return -1;
    const i = parseInt(m[1],10)-1;
    return (i>=0 && i<chapters.length) ? i : -1;
  }

  let shown = null;          // chapitre actuellement affiché (-1 = sommaire)
  let first = true;

  function paint(i){
    [L,R].forEach(el=>{el.style.animation='none';el.offsetHeight;el.style.animation='';});
    i<0 ? renderHome() : renderChapter(i);
    shown = i;
  }

  function render(){
    const i = current();
    if(first){ first=false; paint(i); return; }
    if(i===shown) return;
    const dir = i > shown ? 'next' : 'prev';
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ paint(i); return; }
    const leaf = document.createElement('div');
    leaf.className = 'leaf '+dir;
    spread.appendChild(leaf);
    setTimeout(()=>paint(i), 280);          // le contenu change quand la feuille passe le pli
    leaf.addEventListener('animationend',()=>leaf.remove());
  }

  // la couverture disparaît une fois ouverte
  document.querySelector('.cover .back').addEventListener('animationend',()=>document.getElementById('book').classList.add('opened'));

  function go(i){
    location.hash = i<0 ? '#sommaire' : '#E-'+pad(i+1);
  }

  prev.onclick = ()=>{ const i=current(); go(i-1); };
  next.onclick = ()=>{ const i=current(); if(i<chapters.length-1) go(i+1); };
  document.getElementById('toc').onclick = ()=>go(-1);
  window.addEventListener('hashchange',render);
  window.addEventListener('popstate',render);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight' && !next.disabled) next.click();
    if(e.key==='ArrowLeft' && !prev.disabled) prev.click();
  });

  // glisser du doigt pour tourner les pages (téléphone)
  let tx=null;
  spread.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  spread.addEventListener('touchend',e=>{
    if(tx===null) return;
    const dx=e.changedTouches[0].clientX-tx; tx=null;
    if(dx<-50 && !next.disabled) next.click();
    if(dx>50 && !prev.disabled) prev.click();
  },{passive:true});

  render();
  fixHeight();
  window.addEventListener('resize',()=>{ spread.style.height=''; fixHeight(); });
  if(document.fonts) document.fonts.ready.then(fixHeight);
</script>
</body>
</html>
