<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrimoireS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#2a1509;
    --wood:#4a2912;
    --wood-light:#6b3d1c;
    --gold:#d4a84b;
    --gold-light:#f3d98b;
    --parchment:#e8d9b0;
    --shadow:rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'IM Fell English',Georgia,serif;
    color:var(--parchment);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,170,60,.18), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.8), transparent 70%),
      repeating-linear-gradient(90deg,#1c0e06 0 3px,#22120a 3px 90px,#1a0c05 90px 93px,#24140b 93px 180px),
      #1a0c05;
    display:flex;flex-direction:column;align-items:center;
    padding:40px 16px 60px;
    overflow-x:hidden;
  }

  /* ---------- En-tête ---------- */
  header{text-align:center;margin-bottom:34px}
  h1{
    font-family:'Cinzel Decorative',serif;
    font-weight:900;
    font-size:clamp(2.4rem,7vw,4.8rem);
    letter-spacing:.06em;
    color:var(--gold);
    text-shadow:0 0 18px rgba(212,168,75,.45),0 3px 0 #5a3a0c,0 6px 14px #000;
  }
  .subtitle{
    font-style:italic;font-size:clamp(1rem,2.5vw,1.25rem);
    color:#c9b38a;margin-top:6px;opacity:.85
  }
  .ornament{
    width:min(420px,80%);height:14px;margin:14px auto 0;
    background:
      radial-gradient(circle,var(--gold) 3px,transparent 4px) center/14px 14px no-repeat,
      linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent) center/100% 1px no-repeat;
  }

  /* ---------- Bibliothèque ---------- */
  .bookcase{
    width:min(980px,100%);
    padding:22px 22px 10px;
    background:linear-gradient(180deg,var(--wood-light),var(--wood) 30%,var(--wood-dark));
    border-radius:8px 8px 4px 4px;
    box-shadow:0 30px 60px var(--shadow), inset 0 0 0 4px #1d0e05, inset 0 0 40px rgba(0,0,0,.6);
    position:relative;
  }
  .bookcase::before{ /* fronton */
    content:"";position:absolute;left:-14px;right:-14px;top:-22px;height:26px;
    background:linear-gradient(180deg,#7a4822,#3d200d);
    border-radius:6px 6px 0 0;
    box-shadow:0 6px 12px rgba(0,0,0,.5);
  }

  .shelf{
    position:relative;
    min-height:300px;
    margin-bottom:22px;
    background:
      linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.35) 40%,rgba(0,0,0,.55)),
      repeating-linear-gradient(90deg,#2b160a 0 60px,#311a0c 60px 62px);
    box-shadow:inset 0 12px 25px rgba(0,0,0,.8);
    border-radius:3px;
  }
  .row{
    display:flex;align-items:flex-end;justify-content:center;gap:3px;
    min-height:300px;
    padding:34px 0 0;
    overflow:hidden;
  }
  .row > *{flex-shrink:0}
  .row > .fill{flex:1 1 0;min-width:0;overflow:hidden;padding-top:40px;margin-top:-40px}
  .fill > *{flex-shrink:0}
  .codex-group{display:flex;align-items:flex-end;gap:6px;margin:0 8px}
  .shelf::after{ /* planche */
    content:"";position:absolute;left:-10px;right:-10px;bottom:-20px;height:22px;
    background:linear-gradient(180deg,#8a5429,#5a3216 45%,#3a1e0c);
    border-radius:2px;
    box-shadow:0 8px 14px rgba(0,0,0,.6);
    z-index:2;
  }

  /* ---------- Livres ---------- */
  .book{
    --c1:#6e1414;--c2:#3a0808;
    position:relative;
    width:clamp(54px,8vw,82px);
    height:var(--h,250px);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:18px 0 16px;
    text-decoration:none;
    color:var(--gold-light);
    background:
      linear-gradient(90deg,rgba(0,0,0,.45) 0%,rgba(255,255,255,.12) 18%,rgba(255,255,255,.04) 35%,rgba(0,0,0,.1) 70%,rgba(0,0,0,.5) 100%),
      linear-gradient(180deg,var(--c1),var(--c2));
    border-radius:4px 4px 2px 2px;
    box-shadow:3px 0 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(212,168,75,.55), 0 0 18px rgba(243,200,110,.35);
    transition:transform .35s cubic-bezier(.2,.8,.3,1.2), box-shadow .35s, filter .35s;
    z-index:1;
    cursor:pointer;
    filter:brightness(1.12);
    animation:aura 3.2s infinite ease-in-out;
    animation-delay:var(--d,0s);
  }
  @keyframes aura{
    0%,100%{box-shadow:3px 0 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(212,168,75,.55), 0 0 12px rgba(243,200,110,.25)}
    50%{box-shadow:3px 0 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(243,217,139,.9), 0 0 28px rgba(243,200,110,.6)}
  }
  /* bandes dorées */
  .book::before,.book::after{
    content:"";position:absolute;left:0;right:0;height:10px;
    background:
      linear-gradient(180deg,transparent 0 2px,var(--gold) 2px 3px,transparent 3px 7px,var(--gold) 7px 8px,transparent 8px);
    opacity:.9;
  }
  .book::before{top:8%}
  .book::after{bottom:8%}

  .book .crest{
    width:22px;height:22px;margin-top:10%;
    border:1.5px solid var(--gold);border-radius:50%;
    display:grid;place-items:center;
    font-size:12px;color:var(--gold);
    box-shadow:0 0 6px rgba(212,168,75,.3);
  }
  .book .title{
    writing-mode:vertical-rl;transform:rotate(180deg);
    font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.32em;font-size:clamp(.7rem,1.3vw,.95rem);
    color:var(--gold);
    text-shadow:0 1px 1px #000;
  }
  .book .title-long{letter-spacing:.14em;font-size:clamp(.6rem,1.05vw,.78rem);line-height:1.5;text-align:center}
  .book .num{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(.85rem,1.6vw,1.2rem);
    color:var(--gold-light);
    text-shadow:0 0 6px rgba(243,217,139,.5),0 1px 1px #000;
    margin-bottom:12%;
    line-height:1;
    padding:4px 2px;
    border-top:1px solid rgba(212,168,75,.6);
    border-bottom:1px solid rgba(212,168,75,.6);
  }

  .book:hover,.book:focus-visible{
    transform:translateY(-22px) rotate(-1.5deg);
    box-shadow:0 18px 26px rgba(0,0,0,.7),0 0 26px rgba(243,200,110,.35);
    filter:brightness(1.3);
    z-index:3;
    outline:none;
    animation-play-state:paused;
  }
  .book:hover .num,.book:focus-visible .num{color:#fff6d8}

  /* couleurs individuelles */
  .b1{--c1:#7a1a1a;--c2:#3b0a0a;--h:262px}
  .b2{--c1:#1d4a2e;--c2:#0b2415;--h:238px}
  .b3{--c1:#1f2f5c;--c2:#0c1530;--h:270px}
  .b4{--c1:#4a2466;--c2:#210d33;--h:246px}
  .b5{--c1:#6a3d17;--c2:#331b07;--h:256px}
  .b6{--c1:#222;--c2:#080808;--h:274px}
  .b7{--c1:#115154;--c2:#062628;--h:240px}
  .b8{--c1:#6b1238;--c2:#300617;--h:264px}

  /* livres décoratifs (non cliquables) */
  .deco{
    width:var(--w,20px);height:var(--h,220px);
    background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.07) 30%,rgba(0,0,0,.45)),var(--c,#3b2a1a);
    border-radius:2px 2px 1px 1px;
    box-shadow:2px 0 4px rgba(0,0,0,.5);
    position:relative;
    filter:brightness(.62) saturate(.7);
  }
  .deco::before,.deco::after{
    content:"";position:absolute;left:0;right:0;height:2px;background:rgba(180,140,70,.5)
  }
  .deco::before{top:var(--t1,12%)}
  .deco::after{bottom:var(--t2,14%)}
  .deco.lean-l{transform:rotate(-7deg);transform-origin:bottom left;margin-left:14px}
  .deco.lean-r{transform:rotate(7deg);transform-origin:bottom right;margin-right:14px}
  .stack{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin:0 6px}
  .stack .flat{
    height:var(--hh,16px);width:var(--ww,110px);margin-left:var(--off,0);
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.4)),var(--c,#3b2a1a);
    border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.6);
    filter:brightness(.62) saturate(.7);
    border-left:3px solid rgba(232,217,176,.35);
  }

  /* bougie */
  .candle{
    position:relative;width:18px;height:70px;align-self:flex-end;margin:0 14px;
    background:linear-gradient(90deg,#cbb98f,#f4ead0 40%,#bba673);
    border-radius:3px 3px 0 0;
  }
  .candle::before{ /* flamme */
    content:"";position:absolute;left:50%;top:-26px;width:12px;height:22px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 70%,#fff8d0 0 20%,#ffc24a 45%,#ff7a18 70%,transparent 72%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    filter:blur(.4px);
    animation:flicker 1.8s infinite alternate ease-in-out;
    box-shadow:0 0 30px 12px rgba(255,170,60,.35);
  }
  .candle::after{ /* mèche */
    content:"";position:absolute;left:50%;top:-5px;width:2px;height:6px;background:#222;transform:translateX(-50%)
  }
  @keyframes flicker{
    0%{transform:translateX(-50%) scale(1) rotate(-2deg);opacity:.95}
    50%{transform:translateX(-52%) scale(1.06,1.12) rotate(2deg);opacity:1}
    100%{transform:translateX(-48%) scale(.96,1) rotate(-1deg);opacity:.9}
  }

  /* sablier / orbe */
  .orb{
    width:46px;height:46px;border-radius:50%;align-self:flex-end;margin:0 12px 6px;
    background:radial-gradient(circle at 35% 30%,#d9f3ff,#5fa8d8 30%,#1c3f6e 65%,#08152b);
    box-shadow:0 0 22px rgba(95,168,216,.5), inset -6px -8px 14px rgba(0,0,0,.5);
    position:relative;
    animation:pulse 4s infinite ease-in-out;
  }
  .orb::after{
    content:"";position:absolute;left:8px;right:8px;bottom:-12px;height:10px;
    background:linear-gradient(180deg,#8a6a2a,#4b3510);border-radius:3px
  }
  @keyframes pulse{50%{box-shadow:0 0 36px rgba(95,168,216,.8), inset -6px -8px 14px rgba(0,0,0,.5)}}

  footer{margin-top:36px;font-style:italic;color:#9c8664;font-size:.95rem;text-align:center}

  /* ---------- Mobile ---------- */
  @media (max-width:640px){
    body{padding:30px 16px 40px}
    .bookcase{padding:16px 10px 6px}
    .shelf,.row{min-height:230px}
    .row{padding-top:26px}
    .codex-group{gap:4px;margin:0 4px}
    .book{height:calc(var(--h,250px) * .78);padding:12px 0}
    .deco{height:calc(var(--h,220px) * .78)}
    .candle,.orb{display:none}
    .book .crest{width:18px;height:18px;font-size:10px}
  }
</style>
</head>
<body>

  <header>
    <h1>GrimoireS</h1>
    <p class="subtitle">Choisis un codex et ouvre-le…</p>
    <div class="ornament"></div>
  </header>

  <main class="bookcase">

    <!-- Étagère 1 -->
    <div class="shelf">
      <div class="row">
        <div class="fill fill-left" data-seed="11"></div>
        <span class="candle" aria-hidden="true"></span>
        <div class="codex-group">
          <a class="book b1" href="codex1.html" title="Codex des Entités" style="--d:0.0s">
            <span class="crest">✦</span><span class="title title-long">CODEX<br>DES ENTITÉS</span><span class="num">I</span>
          </a>
          <a class="book b2" href="codex2.html" title="Codex II" style="--d:0.4s">
            <span class="crest">☾</span><span class="title">CODEX</span><span class="num">II</span>
          </a>
          <a class="book b3" href="codex3.html" title="Codex III" style="--d:0.8s">
            <span class="crest">✧</span><span class="title">CODEX</span><span class="num">III</span>
          </a>
          <a class="book b4" href="codex4.html" title="Codex IIII" style="--d:1.2000000000000002s">
            <span class="crest">☉</span><span class="title">CODEX</span><span class="num">IIII</span>
          </a>
        </div>
        <div class="fill fill-right" data-seed="23"></div>
      </div>
    </div>

    <!-- Étagère 2 -->
    <div class="shelf">
      <div class="row">
        <div class="fill fill-left" data-seed="37"></div>
        <div class="codex-group">
          <a class="book b5" href="codex5.html" title="Codex V" style="--d:1.6s">
            <span class="crest">✶</span><span class="title">CODEX</span><span class="num">V</span>
          </a>
          <a class="book b6" href="codex6.html" title="Codex VI" style="--d:2.0s">
            <span class="crest">☽</span><span class="title">CODEX</span><span class="num">VI</span>
          </a>
          <a class="book b7" href="codex7.html" title="Codex VII" style="--d:2.4000000000000004s">
            <span class="crest">✴</span><span class="title">CODEX</span><span class="num">VII</span>
          </a>
          <a class="book b8" href="codex8.html" title="Codex VIII" style="--d:2.8000000000000003s">
            <span class="crest">✹</span><span class="title">CODEX</span><span class="num">VIII</span>
          </a>
        </div>
        <span class="orb" aria-hidden="true"></span>
        <div class="fill fill-right" data-seed="41"></div>
      </div>
    </div>

  </main>

  <footer>~ Bibliothèque des GrimoireS ~</footer>


<script>
  // Remplit les étagères de vieux livres (décor, non cliquables)
  (function(){
    const colors=['#3d2a18','#2c3a24','#4a1e1e','#2a2340','#46301a','#1e3434','#3a1f2e','#2e2e22','#4b3a22','#1f2a3a','#402818','#263322'];
    function rng(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}}
    document.querySelectorAll('.fill').forEach(fill=>{
      const r=rng(parseInt(fill.dataset.seed,10));
      const right=fill.classList.contains('fill-right');
      fill.style.display='flex';
      fill.style.alignItems='flex-end';
      fill.style.gap='3px';
      fill.style.flexDirection=right?'row':'row-reverse';
      for(let i=0;i<34;i++){
        const roll=r();
        if(i>1 && roll<.08){
          const st=document.createElement('div');st.className='stack';st.setAttribute('aria-hidden','true');
          const n=2+Math.floor(r()*3);
          for(let k=0;k<n;k++){
            const f=document.createElement('span');f.className='flat';
            f.style.setProperty('--c',colors[Math.floor(r()*colors.length)]);
            f.style.setProperty('--ww',(80+Math.floor(r()*50))+'px');
            f.style.setProperty('--hh',(12+Math.floor(r()*10))+'px');
            f.style.setProperty('--off',(Math.floor(r()*14)-7)+'px');
            st.appendChild(f);
          }
          fill.appendChild(st);continue;
        }
        const d=document.createElement('span');d.className='deco';
        d.setAttribute('aria-hidden','true');
        d.style.setProperty('--c',colors[Math.floor(r()*colors.length)]);
        d.style.setProperty('--w',(14+Math.floor(r()*18))+'px');
        d.style.setProperty('--h',(170+Math.floor(r()*95))+'px');
        d.style.setProperty('--t1',(8+Math.floor(r()*10))+'%');
        d.style.setProperty('--t2',(8+Math.floor(r()*12))+'%');
        if(roll>.93) d.classList.add(right?'lean-l':'lean-r');
        fill.appendChild(d);
      }
    });
  })();
</script>
</body>
</html>
